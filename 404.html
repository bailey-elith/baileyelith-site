  <script>
// Tab toggle script for Webflow
// Function to switch tabs
function switchTab(targetTab) {
  // Remove active class from all tab toggles
  const tabToggles = document.querySelectorAll('[data-tab-toggle]');
  tabToggles.forEach(t => t.classList.remove('active'));
  // Remove active styling from all dropdown containers
  const allDropdowns = document.querySelectorAll('.inner-side_dropdown');
  allDropdowns.forEach(dropdown => {
    dropdown.style.backgroundColor = '';
  });
  // Find the toggle button with matching data-tab-toggle value
  const activeToggle = document.querySelector(`[data-tab-toggle="${targetTab}"]`);
  if (activeToggle) {
    // Add active class to the toggle
    activeToggle.classList.add('active');
    // Add active styling to parent dropdown if it exists
    const parentDropdown = activeToggle.closest('.inner-side_dropdown');
    if (parentDropdown) {
      parentDropdown.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
    }
  }
  // Hide all tab content
  const allTabItems = document.querySelectorAll('[data-tab-item]');
  allTabItems.forEach(item => item.classList.remove('active'));
  // Show matching tab content
  const matchingTab = document.querySelector(`[data-tab-item="${targetTab}"]`);
  if (matchingTab) {
    matchingTab.classList.add('active');
  }
  // Scroll to top of .inner-main_wrapper
  const mainWrapper = document.querySelector('.inner-main_wrapper');
  if (mainWrapper) {
    mainWrapper.scrollTop = 0;
  }
}
// Function to scroll to top
function scrollToTop() {
  const mainWrapper = document.querySelector('.inner-main_wrapper');
  if (mainWrapper) {
    mainWrapper.scrollTop = 0;
  }
}
// Set initial active state on page load
const initialActiveTab = document.querySelector('[data-tab-item].active');
if (initialActiveTab) {
  const initialTabValue = initialActiveTab.getAttribute('data-tab-item');
  switchTab(initialTabValue);
}
// Add click event to dropdown tab toggle buttons
const tabToggles = document.querySelectorAll('[data-tab-toggle]');
tabToggles.forEach(toggle => {
  toggle.addEventListener('click', () => {
    const targetTab = toggle.getAttribute('data-tab-toggle');
    switchTab(targetTab);
  });
});
// Add click event to sidebar navigation buttons
const sidebarToggles = document.querySelectorAll('[data-sidebar-toggle]');
sidebarToggles.forEach(toggle => {
  toggle.addEventListener('click', () => {
    const targetTab = toggle.getAttribute('data-sidebar-toggle');
    switchTab(targetTab);
  });
});
// Watch for Webflow native tab changes and scroll to top
const webflowTabLinks = document.querySelectorAll('.w-tab-link');
webflowTabLinks.forEach(tabLink => {
  tabLink.addEventListener('click', () => {
    // Small delay to ensure Webflow's tab has switched
    setTimeout(scrollToTop, 50);
  });
});
</script>
  <script>
document.addEventListener('DOMContentLoaded', () => {
  // Check if user is on a touch device
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  // Exit early if on mobile/tablet
  if (isTouchDevice) return;
  const tooltips = document.querySelectorAll('[data-tooltip]');
  tooltips.forEach(tooltip => {
    // Create tooltip elements
    const tooltipBubble = document.createElement('div');
    const tooltipArrow = document.createElement('div');
    tooltipBubble.className = 'tooltip-bubble';
    tooltipArrow.className = 'tooltip-arrow';
    tooltipBubble.textContent = tooltip.getAttribute('data-tooltip');
    document.body.appendChild(tooltipBubble);
    document.body.appendChild(tooltipArrow);
    const updatePosition = () => {
      const rect = tooltip.getBoundingClientRect();
      const tooltipWidth = tooltipBubble.offsetWidth;
      const tooltipHeight = 24;
      const arrowSize = 5;
      const gap = 4;
      let tooltipTop = rect.top - tooltipHeight - gap - arrowSize;
      let tooltipLeft = rect.left + rect.width / 2 - tooltipWidth / 2;
      let arrowTop = rect.top - arrowSize - gap;
      let arrowLeft = rect.left + rect.width / 2 - arrowSize;
      // Check boundaries
      if (tooltipTop < 10) {
        tooltipTop = rect.bottom + gap + arrowSize;
        arrowTop = rect.bottom + gap;
        tooltipArrow.classList.add('arrow-bottom');
      } else {
        tooltipArrow.classList.remove('arrow-bottom');
      }
      if (tooltipLeft + tooltipWidth > window.innerWidth - 10) {
        tooltipLeft = window.innerWidth - tooltipWidth - 10;
      }
      if (tooltipLeft < 10) {
        tooltipLeft = 10;
      }
      tooltipBubble.style.top = `${tooltipTop}px`;
      tooltipBubble.style.left = `${tooltipLeft}px`;
      tooltipArrow.style.top = `${arrowTop}px`;
      tooltipArrow.style.left = `${arrowLeft}px`;
    };
    tooltip.addEventListener('mouseenter', () => {
      updatePosition();
      tooltipBubble.classList.add('visible');
      tooltipArrow.classList.add('visible');
    });
    tooltip.addEventListener('mouseleave', () => {
      tooltipBubble.classList.remove('visible');
      tooltipArrow.classList.remove('visible');
    });
    window.addEventListener('scroll', () => {
      if (tooltipBubble.classList.contains('visible')) {
        updatePosition();
      }
    }, true);
  });
});
</script>
  <script>
document.querySelectorAll('[data-dropdown]').forEach(dropdown => {
  const list = dropdown.querySelector('[data-dropdown-list]');
  const toggle = dropdown.querySelector('[data-dropdown-toggle]');
  // Ensure initial open dropdown has proper height
  if (dropdown.classList.contains('open')) {
    list.style.height = 'auto';
  } else {
    list.style.height = '0rem';
  }
  toggle.addEventListener('click', () => {
    if (dropdown.classList.contains('open')) {
      // Collapse
      list.style.height = list.scrollHeight + 'px';
      requestAnimationFrame(() => {
        list.style.height = '0rem';
      });
      dropdown.classList.remove('open');
    } else {
      // Expand
      list.style.height = list.scrollHeight + 'px';
      dropdown.classList.add('open');
      list.addEventListener('transitionend', function handler() {
        list.style.height = 'auto';
        list.removeEventListener('transitionend', handler);
      });
    }
  });
});
</script>

// Static timestamp updater for Slack-style chat
// Updates timestamps once on page load, then keeps them static
function updateTimestamps() {
  const now = new Date();
  const timestampElements = document.querySelectorAll('[data-timestamp]');
  timestampElements.forEach(element => {
    const type = element.getAttribute('data-timestamp');
    let timeString = '';
    switch(type) {
      case 'now':
        timeString = formatTime(now);
        break;
      case '1min':
        const oneMinAgo = new Date(now - 1 * 60 * 1000);
        timeString = formatTime(oneMinAgo);
        break;
      case '2min':
        const twoMinAgo = new Date(now - 2 * 60 * 1000);
        timeString = formatTime(twoMinAgo);
        break;
      case '5min':
        const fiveMinAgo = new Date(now - 5 * 60 * 1000);
        timeString = formatTime(fiveMinAgo);
        break;
      case '10min':
        const tenMinAgo = new Date(now - 10 * 60 * 1000);
        timeString = formatTime(tenMinAgo);
        break;
      case 'today':
        timeString = formatTime(now);
        break;
      case 'yesterday':
        const yesterday = new Date(now - 24 * 60 * 60 * 1000);
        timeString = `Yesterday at ${formatTime(yesterday)}`;
        break;
      default:
        timeString = formatTime(now);
    }
    element.textContent = timeString;
  });
}
function formatTime(date) {
  let hours = date.getHours();
  const minutes = date.getMinutes();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12; // 0 should be 12
  const minutesStr = minutes < 10 ? '0' + minutes : minutes;
  return `${hours}:${minutesStr} ${ampm}`;
}
// Run once on page load only
updateTimestamps();
</script>
  <script>
// Reaction counter system
document.addEventListener('DOMContentLoaded', () => {
  const reactionButtons = document.querySelectorAll('[data-reaction]');
  reactionButtons.forEach(reactionElement => {
    // Get initial count from data attribute
    const initialCount = parseInt(reactionElement.getAttribute('data-reaction')) || 0;
    // Find the clickable button (parent with .reaction_toggle class)
    const button = reactionElement.closest('.reaction_toggle');
    if (!button) return; // Skip if no button found
    // Create a unique storage key based on button's position/content
    const buttonId = reactionElement.getAttribute('data-reaction-id') || 
                     reactionElement.closest('[data-portfolio-item]')?.getAttribute('data-portfolio-item') ||
                     `reaction-${Array.from(reactionButtons).indexOf(reactionElement)}`;
    const storageKey = `reaction-count-${buttonId}`;
    const clickedKey = `reaction-clicked-${buttonId}`;
    // Check if user has already clicked this reaction
    let hasClicked = localStorage.getItem(clickedKey) === 'true';
    // Get stored count or use initial count
    let currentCount = parseInt(localStorage.getItem(storageKey)) || initialCount;
    // Update the display
    updateDisplay(reactionElement, currentCount, hasClicked);
    // Add click handler with toggle functionality
    button.addEventListener('click', () => {
      if (!hasClicked) {
        // First click - add reaction
        currentCount++;
        localStorage.setItem(storageKey, currentCount);
        localStorage.setItem(clickedKey, 'true');
        hasClicked = true;
        updateDisplay(reactionElement, currentCount, true);
      } else {
        // Second click - remove reaction
        currentCount--;
        localStorage.setItem(storageKey, currentCount);
        localStorage.removeItem(clickedKey);
        hasClicked = false;
        updateDisplay(reactionElement, currentCount, false);
      }
    });
  });
  function updateDisplay(reactionElement, count, clicked) {
    // Update the text content with the count
    reactionElement.textContent = count;
    // Find the button to add visual feedback
    const button = reactionElement.closest('.reaction_toggle');
    // Add visual feedback to the button if already clicked
    if (button) {
      if (clicked) {
        button.classList.add('reacted');
      } else {
        button.classList.remove('reacted');
      }
    }
  }
});
</script>
  <script>
// Toggle .message-form_layout and .message-form_clickable with Cmd+/ or Ctrl+/
document.addEventListener('keydown', (e) => {
  // Check for Cmd+/ (Mac) or Ctrl+/ (Windows/Linux)
  if ((e.metaKey || e.ctrlKey) && e.key === '/') {
    e.preventDefault(); // Prevent default browser behavior
    toggleForm();
  }
});
// Toggle form on click of elements with data-form-open
document.querySelectorAll('[data-form-open]').forEach(trigger => {
  trigger.addEventListener('click', () => {
    toggleForm();
  });
});
// Close form on click of elements with data-form-close
document.querySelectorAll('[data-form-close]').forEach(trigger => {
  trigger.addEventListener('click', () => {
    closeForm();
  });
});
// Function to toggle form visibility
function toggleForm() {
  const formLayout = document.querySelector('.message-form_layout');
  const formClickable = document.querySelector('.message-form_clickable');
  if (formLayout && formClickable) {
    // Toggle between open and closed states
    if (formLayout.style.display === 'flex') {
      // Close: hide layout, show clickable
      formLayout.style.display = 'none';
      formClickable.style.display = 'flex';
    } else {
      // Open: show layout, hide clickable
      formLayout.style.display = 'flex';
      formClickable.style.display = 'none';
    }
  }
}
// Function to close form
function closeForm() {
  const formLayout = document.querySelector('.message-form_layout');
  const formClickable = document.querySelector('.message-form_clickable');
  if (formLayout && formClickable) {
    // Close: hide layout, show clickable
    formLayout.style.display = 'none';
    formClickable.style.display = 'flex';
  }
}
</script>
